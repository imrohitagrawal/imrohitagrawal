<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1018" viewBox="0 0 600 1018" role="img" aria-labelledby="title desc">
  <title id="title">Outcome-first trustworthy systems delivery model for mobile</title>
  <desc id="desc">Four stacked delivery gates connect customer discovery, a system boundary, release evidence, runtime operation, and production learning. Trust and runtime controls span every gate, and learning returns to discovery.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#426B8A"/></marker></defs>
  <rect width="600" height="1018" fill="#F6F4EF"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#17202A">
    <text x="32" y="40" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="26" letter-spacing="0.4" fill="#536171">TRUSTWORTHY SYSTEMS DELIVERY MODEL</text><path d="M32 58H568" stroke="#C7CDD4"/>
    <path d="M32 88V786" stroke="#426B8A" stroke-width="2" marker-end="url(#arrow)"/>
    <g fill="#F6F4EF" stroke="#426B8A" stroke-width="2"><circle cx="32" cy="94" r="6"/><circle cx="32" cy="270" r="6"/><circle cx="32" cy="446" r="6"/><circle cx="32" cy="622" r="6"/></g>
    <g stroke="#C7CDD4"><path d="M58 258H568"/><path d="M58 434H568"/><path d="M58 610H568"/><path d="M58 786H568"/></g>
    <g font-size="30" font-weight="650"><text x="58" y="100">UNDERSTAND</text><text x="58" y="276">DESIGN &amp; DELIVER</text><text x="58" y="452">ASSURE &amp; SHIP</text><text x="58" y="628">RUN &amp; IMPROVE</text></g>
    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="28" fill="#426B8A"><text x="58" y="136">DECISION BRIEF</text><text x="58" y="312">SYSTEM BOUNDARY</text><text x="58" y="488">RELEASE EVIDENCE</text><text x="58" y="664">LEARNING BACKLOG</text></g>
    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="28" fill="#426B8A"><text x="58" y="178">01</text><text x="318" y="178">02</text><text x="58" y="354">03</text><text x="318" y="354">04</text><text x="58" y="530">05</text><text x="318" y="530">06</text><text x="58" y="706">07</text><text x="318" y="706">08</text></g>
    <g font-size="30" font-weight="650"><text x="106" y="178">Discover</text><text x="366" y="178">Frame</text><text x="106" y="354">Architect</text><text x="366" y="354">Build</text><text x="106" y="530">Evaluate</text><text x="366" y="530">Release</text><text x="106" y="706">Operate</text><text x="366" y="706">Learn</text></g>
    <g font-size="26" fill="#536171">
      <text x="58" y="212"><tspan x="58">Customer problem</tspan><tspan x="58" dy="28">Users · outcomes</tspan></text><text x="318" y="212"><tspan x="318">Requirements · data</tspan><tspan x="318" dy="28">Constraints · risks</tspan></text>
      <text x="58" y="388"><tspan x="58">Services · APIs</tspan><tspan x="58" dy="28">Trust boundaries</tspan></text><text x="318" y="388"><tspan x="318">Workflows · integrations</tspan><tspan x="318" dy="28">Platform</tspan></text>
      <text x="58" y="564"><tspan x="58">LLM evaluation</tspan><tspan x="58" dy="28">Security</tspan></text><text x="318" y="564"><tspan x="318">CI/CD · gates</tspan><tspan x="318" dy="28">Canaries · rollback</tspan></text>
