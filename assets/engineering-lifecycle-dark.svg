<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Outcome-first trustworthy systems delivery model</title>
  <desc id="desc">Four gates move from Discover through Learn. Decision Brief enables System Boundary, then Release Evidence and Learning Backlog. Trust &amp; Evidence and Runtime Discipline span every gate. Learn informs the next Discover cycle.</desc>
