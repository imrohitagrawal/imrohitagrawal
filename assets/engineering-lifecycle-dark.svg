<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Outcome-first trustworthy systems delivery model</title>
  <desc id="desc">Four delivery gates connect customer discovery, a system boundary, release evidence, runtime operation, and production learning. Trust and runtime controls span every gate, and learning returns to discovery.</desc>
