    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" fill="#7FA3C7"><text x="40" y="166">01</text><text x="40" y="236">02</text><text x="264" y="166">03</text><text x="264" y="236">04</text><text x="488" y="166">05</text><text x="488" y="236">06</text><text x="712" y="166">07</text><text x="712" y="236">08</text></g>
