      <text x="58" y="138">OUTPUT: DECISION BRIEF</text><text x="58" y="326">OUTPUT: SYSTEM BOUNDARY</text><text x="58" y="514">OUTPUT: RELEASE EVIDENCE</text><text x="58" y="730">OUTPUT: LEARNING BACKLOG</text>
    </g>
    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="26" fill="#7FA3C7">
