<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1018" viewBox="0 0 600 1018" role="img" aria-labelledby="title desc">
  <title id="title">Trustworthy systems delivery model for mobile</title>
  <desc id="desc">Four stacked delivery gates pair eight stages from discovery to learning. Trust and runtime controls span the model, and learning returns to discovery.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7FA3C7"/>
    </marker>
  </defs>
  <rect width="600" height="1018" fill="#0D1117"/>
