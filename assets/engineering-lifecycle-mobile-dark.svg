    </g>
    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="26" fill="#7FA3C7">
      <text x="58" y="134">OUTPUT: DECISION BRIEF</text><text x="58" y="310">OUTPUT: SYSTEM BOUNDARY</text><text x="58" y="486">OUTPUT: RELEASE EVIDENCE</text><text x="58" y="662">OUTPUT: LEARNING BACKLOG</text>
    </g>
    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="26" fill="#7FA3C7">
