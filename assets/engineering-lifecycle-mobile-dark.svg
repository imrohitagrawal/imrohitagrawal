<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1280" viewBox="0 0 600 1280" role="img" aria-labelledby="title desc">
  <title id="title">Engineering lifecycle for mobile</title>
  <desc id="desc">Eight vertically ordered stages move from customer discovery through architecture, delivery, evaluation, release, operation, and production learning, with feedback returning to discovery.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7FA3C7"/></marker>
  </defs>
  <rect width="600" height="1280" fill="#0D1117"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
    <g transform="translate(40 28)"><rect width="520" height="126" fill="#161B22" stroke="#6B7683" stroke-width="3"/><text x="24" y="42" fill="#7FA3C7" font-size="24" font-weight="700">01</text><text x="82" y="43" fill="#F0F6FC" font-size="32" font-weight="700">Discover</text><text x="24" y="82" fill="#AAB4BE" font-size="26">Customer problem · users · outcomes</text></g>
    <g transform="translate(40 182)"><rect width="520" height="126" fill="#161B22" stroke="#6B7683" stroke-width="3"/><text x="24" y="42" fill="#7FA3C7" font-size="24" font-weight="700">02</text><text x="82" y="43" fill="#F0F6FC" font-size="32" font-weight="700">Frame</text><text x="24" y="82" fill="#AAB4BE" font-size="26">Requirements · constraints · risks · data</text></g>
    <g transform="translate(40 336)"><rect width="520" height="126" fill="#161B22" stroke="#6B7683" stroke-width="3"/><text x="24" y="42" fill="#7FA3C7" font-size="24" font-weight="700">03</text><text x="82" y="43" fill="#F0F6FC" font-size="32" font-weight="700">Architect</text><text x="24" y="82" fill="#AAB4BE" font-size="26">Services · APIs · data · trust boundaries</text></g>
    <g transform="translate(40 490)"><rect width="520" height="126" fill="#161B22" stroke="#6B7683" stroke-width="3"/><text x="24" y="42" fill="#7FA3C7" font-size="24" font-weight="700">04</text><text x="82" y="43" fill="#F0F6FC" font-size="32" font-weight="700">Build</text><text x="24" y="82" fill="#AAB4BE" font-size="26">AI workflows · integrations · platform</text></g>
    <g transform="translate(40 644)"><rect width="520" height="126" fill="#161B22" stroke="#6B7683" stroke-width="3"/><text x="24" y="42" fill="#7FA3C7" font-size="24" font-weight="700">05</text><text x="82" y="43" fill="#F0F6FC" font-size="32" font-weight="700">Evaluate</text><text x="24" y="82" fill="#AAB4BE" font-size="26">Tests · LLM evals · security · performance</text></g>
    <g transform="translate(40 798)"><rect width="520" height="126" fill="#161B22" stroke="#6B7683" stroke-width="3"/><text x="24" y="42" fill="#7FA3C7" font-size="24" font-weight="700">06</text><text x="82" y="43" fill="#F0F6FC" font-size="32" font-weight="700">Release</text><text x="24" y="82" fill="#AAB4BE" font-size="26">CI/CD · gates · canaries · rollback</text></g>
    <g transform="translate(40 952)"><rect width="520" height="126" fill="#161B22" stroke="#6B7683" stroke-width="3"/><text x="24" y="42" fill="#7FA3C7" font-size="24" font-weight="700">07</text><text x="82" y="43" fill="#F0F6FC" font-size="32" font-weight="700">Operate</text><text x="24" y="82" fill="#AAB4BE" font-size="26">Observability · SLOs · incidents</text><text x="24" y="112" fill="#AAB4BE" font-size="26">Reliability · cost</text></g>
    <g transform="translate(40 1106)"><rect width="520" height="126" fill="#161B22" stroke="#7FA3C7" stroke-width="4"/><text x="24" y="42" fill="#7FA3C7" font-size="24" font-weight="700">08</text><text x="82" y="43" fill="#F0F6FC" font-size="32" font-weight="700">Learn</text><text x="24" y="82" fill="#AAB4BE" font-size="26">Production feedback · adoption</text><text x="24" y="112" fill="#AAB4BE" font-size="26">Continuous improvement</text></g>
  </g>
