    <path d="M32 58H568" stroke="#303B47"/>
    <path d="M32 88V786" stroke="#7FA3C7" stroke-width="2" marker-end="url(#arrow)"/>
    <g fill="#0D1117" stroke="#7FA3C7" stroke-width="2">
